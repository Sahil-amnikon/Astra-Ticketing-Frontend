name: amnikon-web
x-api: &api
  image: amnikon-api:${RELEASE_TAG:-phase1}
  build:
    context: ..
    dockerfile: infra/Dockerfile.api
  environment: &api-env
    NODE_ENV: production
    DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
    REDIS_URL: redis://redis:6379
    APP_BASE_URL: ${APP_BASE_URL:?Set APP_BASE_URL}
    ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    MAIL_CONFIG_KEY: ${MAIL_CONFIG_KEY:-}
  init: true
  restart: unless-stopped
  read_only: true
  tmpfs: [/tmp]
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
services:
  frontend:
    image: amnikon-web:${RELEASE_TAG:-phase1}
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
    environment:
      API_INTERNAL_URL: http://backend:3001
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_healthy
    init: true
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
  backend:
    <<: *api
    environment:
      <<: *api-env
      WEB_GUIDANCE_ENABLED: ${WEB_GUIDANCE_ENABLED:-false}
      WEB_GUIDANCE_PROVIDER: ${WEB_GUIDANCE_PROVIDER:-searxng}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      INITIAL_ADMIN_OBJECT_IDS: ${INITIAL_ADMIN_OBJECT_IDS:-}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      CHANGE_EMAIL_ENABLED: ${CHANGE_EMAIL_ENABLED:-false}
      CHANGE_EMAIL_SENDER: ${CHANGE_EMAIL_SENDER:-}
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 768m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 20s
  worker:
    <<: *api
    command: ['node', 'apps/api/dist/src/worker.js']
    environment:
      <<: *api-env
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
      INITIAL_ADMIN_OBJECT_IDS: ''
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      CHANGE_EMAIL_ENABLED: ${CHANGE_EMAIL_ENABLED:-false}
      CHANGE_EMAIL_SENDER: ${CHANGE_EMAIL_SENDER:-}
    depends_on:
      backend:
        condition: service_healthy
    mem_limit: 384m
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 6s
      retries: 3
  migrate:
    <<: *api
    profiles: [tools]
    environment:
      MIGRATION_DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL}
    command: ['node', 'scripts/migrate.cjs']
    restart: 'no'
    mem_limit: 384m
  redis:
    image: redis:7.4.9-bookworm
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--maxmemory',
        '128mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    volumes: ['redis-data:/data']
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
  searxng:
    image: searxng/searxng:latest
    profiles: [web-guidance]
    restart: unless-stopped
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?Generate SEARXNG_SECRET in .env}
      SEARXNG_LIMITER: 'false'
      SEARXNG_IMAGE_PROXY: 'false'
      SEARXNG_PUBLIC_INSTANCE: 'false'
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 512m
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
volumes:
  redis-data:
