name: amnikon-db
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: amnikon_owner
      POSTGRES_DB: amnikon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Set APP_DB_PASSWORD}
    ports:
      - '${DB_BIND_ADDRESS:-127.0.0.1}:5432:5432'
    volumes:
      - database:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U amnikon_owner -d amnikon']
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 2g
    shm_size: 256mb
volumes:
  database:
