name: astra-windows-local
x-api-environment: &api-environment
  NODE_ENV: development
  DATABASE_URL: postgresql://amnikon_app:${APP_DB_PASSWORD:?Run Initialize-Windows.ps1}@postgres:5432/amnikon
  REDIS_URL: redis://redis:6379
  APP_BASE_URL: http://localhost:3000
  ENTRA_TENANT_ID: ${ENTRA_TENANT_ID:-}
  ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
  ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
  INITIAL_ADMIN_OBJECT_IDS: ${INITIAL_ADMIN_OBJECT_IDS:-}
  MAIL_CONFIG_KEY: ${MAIL_CONFIG_KEY:?Run Initialize-Windows.ps1}
  SESSION_TTL_SECONDS: '28800'
  CHANGE_EMAIL_ENABLED: 'false'
  WEB_GUIDANCE_ENABLED: 'false'
  ATTACHMENT_STORAGE_ROOT: /app/storage
  ATTACHMENT_STORAGE_MARKER: .amnikon-storage-ready
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16-bookworm
    environment:
      POSTGRES_USER: amnikon_owner
      POSTGRES_DB: amnikon
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run Initialize-Windows.ps1}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Run Initialize-Windows.ps1}
    ports: ['127.0.0.1:54329:5432']
    volumes:
      - windows-postgres:/var/lib/postgresql/data
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U amnikon_owner -d amnikon']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  redis:
    image: redis:7.4.9-bookworm
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory', '128mb', '--maxmemory-policy', 'noeviction']
    ports: ['127.0.0.1:16379:6379']
    volumes: ['windows-redis:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  storage-init:
    image: astra-windows-api:local
    user: '0:0'
    command: ['sh', '-c', 'mkdir -p /app/storage && chown 1000:1000 /app/storage && touch /app/storage/.amnikon-storage-ready && chown 1000:1000 /app/storage/.amnikon-storage-ready']
    volumes: ['windows-attachments:/app/storage']
    restart: 'no'
  migrate:
    image: astra-windows-api:local
    profiles: [tools]
    environment:
      MIGRATION_DATABASE_URL: postgresql://amnikon_owner:${POSTGRES_PASSWORD:?Run Initialize-Windows.ps1}@postgres:5432/amnikon
    command: ['node', 'scripts/migrate.cjs']
    depends_on:
      postgres: {condition: service_healthy}
    restart: 'no'
  backend:
    image: astra-windows-api:local
    build: {context: '.', dockerfile: infra/Dockerfile.api}
    environment: *api-environment
    volumes: ['windows-attachments:/app/storage']
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      storage-init: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    init: true
  worker:
    image: astra-windows-api:local
    environment: *api-environment
    command: ['node', 'apps/api/dist/src/worker.js']
    volumes: ['windows-attachments:/app/storage']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3002/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    init: true
  frontend:
    image: astra-windows-web:local
    build: {context: '.', dockerfile: infra/Dockerfile.web}
    environment: {API_INTERNAL_URL: 'http://backend:3001'}
    ports: ['127.0.0.1:3000:3000']
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 30s
    restart: unless-stopped
    init: true
volumes:
  windows-postgres:
  windows-redis:
  windows-attachments:
